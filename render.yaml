# Render blueprint — one-click deploy from this repo
# https://dashboard.render.com/blueprints

databases:
  - name: storybuddy-db
    plan: free

services:
  - type: web
    name: storybuddy
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: storybuddy-db
          property: connectionString
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: ELEVENLABS_SPEED
        value: "0.8"
      - key: SOUND_VOLUME
        value: "0.5"
